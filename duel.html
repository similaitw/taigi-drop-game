<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#d9412b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<script src="lib/qrcode.js"></script>
<script src="common.js"></script>
<title>搶答對決・台語闖關</title>
<style>
html,body{overflow:hidden}
#arena{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;z-index:1}
.side{position:relative;display:flex;flex-direction:column;gap:10px;padding:12px;transition:filter .2s}
.side.p1{background:linear-gradient(#ffe1d9,#ffc9bc);border-right:4px solid var(--line)}
.side.p2{background:linear-gradient(#d9ecff,#bcdcff)}
.side.lock{filter:grayscale(.9) brightness(.85)}
.side .hd{display:flex;align-items:center;justify-content:space-between}
.side .nm{font-weight:900;font-size:clamp(18px,2.6vw,28px)}
.p1 .nm{color:var(--red)}.p2 .nm{color:var(--blue)}
.side .sc{font-size:clamp(34px,6vw,64px);font-weight:900;line-height:1}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:#fff}
.p1 .dots i.on{background:var(--red)}.p2 .dots i.on{background:var(--blue)}
.word{background:#fff;border:4px solid var(--line);border-radius:20px;text-align:center;padding:12px 8px;box-shadow:0 6px 0 var(--line)}
.word .hj{font-family:"Noto Serif TC",serif;font-weight:900;color:var(--ink);line-height:1.15}
.word .t{font-size:clamp(13px,1.8vw,18px);color:#7a5f48}
.opts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{font-family:inherit;font-weight:900;font-size:clamp(20px,3.4vw,34px);border:3px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 5px 0 var(--line);cursor:pointer;color:var(--ink);padding:6px}
.opts button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.opts button.ok{background:var(--ok);color:#fff}.opts button.bad{background:var(--bad);color:#fff}.opts button.ans{background:var(--gold)}
.flash{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,8vw,90px);font-weight:900;opacity:0;transition:opacity .2s;z-index:3}
.flash.show{opacity:1}
.flash.ok{color:var(--ok)}.flash.bad{color:var(--bad)}
.tools{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:6px}
/* 直式：上下對坐（上方轉 180 度），平板平放在桌上兩人面對面 */
@media (orientation:portrait){
  #arena{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .side.p1{order:2;border-right:none;border-top:4px solid var(--line)}
  .side.p2{order:1;transform:rotate(180deg)}
  .tools{top:50%;transform:translate(-50%,-50%)}
}
</style>
</head>
<body>
<div id="arena">
  <div class="side p1" id="s1"><div class="hd"><span class="nm">🔴 紅隊</span><span class="sc" id="sc1">0</span></div><div class="dots" id="d1"></div>
    <div class="word"><div class="hj" id="w1">　</div><div class="t tl" id="t1"></div></div><div class="opts" id="o1"></div><div class="flash" id="f1"></div></div>
  <div class="side p2" id="s2"><div class="hd"><span class="nm">🔵 藍隊</span><span class="sc" id="sc2">0</span></div><div class="dots" id="d2"></div>
    <div class="word"><div class="hj" id="w2">　</div><div class="t tl" id="t2"></div></div><div class="opts" id="o2"></div><div class="flash" id="f2"></div></div>
</div>
<div class="tools"><button class="iconbtn" id="musicBtn">🎵</button><button class="iconbtn" id="stopBtn">⏹</button><a class="iconbtn" href="/booth">🏠</a></div>

<div class="overlay" id="startOv"><div class="panel">
  <h1>⚔️ 搶答對決</h1>
  <p class="sub">兩人對戰！中間出現台語，誰先按對華語誰得分。<br>按錯會被凍結 1.5 秒。平板可以平放，兩人面對面玩。</p>
  <h2>難度</h2><div class="seg" id="lvSeg"><button data-l="easy">入門</button><button data-l="mid" class="sel">進階</button><button data-l="hard">達人</button></div>
  <h2>先拿幾分獲勝</h2><div class="seg" id="tgSeg"><button data-t="5">5 分</button><button data-t="7" class="sel">7 分</button><button data-t="10">10 分</button></div>
  <div class="row"><button class="btn red big" id="startBtn" style="flex:1">開戰 ▶</button></div>
  <p class="muted" id="srcInfo" style="text-align:center"></p>
</div></div>
<div class="overlay hide" id="endOv"><div class="panel" style="text-align:center">
  <h1 id="endTitle"></h1><div class="big-num" id="endScore"></div><p class="sub">兩位都完成挑戰，一起掃描蓋章！</p>
  <div id="passBox"></div>
  <div class="row" style="justify-content:center"><button class="btn red" id="againBtn">再戰一場</button><a class="btn" href="/booth">集章卡</a></div>
</div></div>
<script>
const {$,shuffle,esc}=T;
let WORDS=[],pool=[],bag=[],lv=T.store.get('duel_lv','mid'),target=+T.store.get('duel_tg',7),sc=[0,0],cur=null,opts=[[],[]],lockUntil=[0,0],round=false,playing=false;
T.bindMusicBtn($('musicBtn'));T.onFirstTouch=()=>{if(!playing)T.music.play('title')};
function seg(id,key,val,cb){document.querySelectorAll('#'+id+' button').forEach(b=>{b.classList.toggle('sel',b.dataset[key]===String(val));b.onclick=()=>{cb(b.dataset[key]);seg(id,key,b.dataset[key],cb)}})}
seg('lvSeg','l',lv,v=>{lv=v;T.store.set('duel_lv',v)});seg('tgSeg','t',target,v=>{target=+v;T.store.set('duel_tg',+v)});
T.loadWords().then(w=>{WORDS=w;$('srcInfo').textContent=`題庫：${T.wordSource}・${w.length} 詞`});
function dots(){[0,1].forEach(p=>$('d'+(p+1)).innerHTML=Array.from({length:target},(_,i)=>`<i class="${i<sc[p]?'on':''}"></i>`).join(''));$('sc1').textContent=sc[0];$('sc2').textContent=sc[1]}
function next(){
  if(!bag.length)bag=shuffle(pool.slice());cur=bag.pop();
  const others=[...new Set(shuffle(pool.filter(w=>w.zh!==cur.zh)).map(w=>w.zh))].slice(0,3);const base=[cur.zh,...others];
  [0,1].forEach(p=>{opts[p]=shuffle(base.slice());const k=p+1;
    $('w'+k).textContent=cur.hj;T.fitSize($('w'+k),cur.hj,60);$('t'+k).textContent=cur.tl;
    $('o'+k).innerHTML=opts[p].map(z=>`<button data-z="${esc(z)}">${esc(z)}</button>`).join('');
    $('s'+k).classList.remove('lock')});
  round=true;
}
function flash(p,txt,cls){const f=$('f'+(p+1));f.textContent=txt;f.className='flash show '+cls;setTimeout(()=>f.className='flash',700)}
[0,1].forEach(p=>$('o'+(p+1)).addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b||!round||!playing)return;e.preventDefault();
  if(performance.now()<lockUntil[p])return;
  if(b.dataset.z===cur.zh){round=false;sc[p]++;dots();b.classList.add('ok');
    const o=1-p;document.querySelectorAll('#o'+(o+1)+' button').forEach(x=>{if(x.dataset.z===cur.zh)x.classList.add('ans')});
    flash(p,'+1 讚！','ok');flash(o,'慢一步！','bad');T.sfx.ok(sc[p]);const r=b.getBoundingClientRect();T.confetti(r.left+r.width/2,r.top+r.height/2,16);
    if(sc[p]>=target){setTimeout(()=>end(p),900);return}
    setTimeout(next,1100);
  }else{b.classList.add('bad');lockUntil[p]=performance.now()+1500;$('s'+(p+1)).classList.add('lock');flash(p,'凍結！','bad');T.sfx.bad();
    setTimeout(()=>$('s'+(p+1)).classList.remove('lock'),1500)}
}));
function start(){T.fullscreen();$('startOv').classList.add('hide');$('endOv').classList.add('hide');
  pool=T.byLevel(WORDS,T.LEVELS[lv].lv);bag=[];sc=[0,0];lockUntil=[0,0];dots();
  [1,2].forEach(k=>{$('w'+k).textContent='準備';T.fitSize($('w'+k),'準備',60);$('t'+k).textContent='';$('o'+k).innerHTML=''});
  T.music.play('battle');T.countdown(()=>{playing=true;next()})}
function end(p){playing=false;round=false;T.music.stop();T.sfx.win();T.confetti(innerWidth/2,innerHeight/3,50);
  $('endTitle').textContent=(p===0?'🔴 紅隊':'🔵 藍隊')+' 獲勝！';$('endScore').textContent=sc[0]+' : '+sc[1];
  T.showPass($('passBox'),'duel');$('endOv').classList.remove('hide');setTimeout(()=>T.music.play('title'),1800)}
$('startBtn').onclick=start;$('againBtn').onclick=start;
$('stopBtn').onclick=()=>{playing=false;round=false;T.music.play('title');$('endOv').classList.add('hide');$('startOv').classList.remove('hide')};
</script>
</body>
</html>
