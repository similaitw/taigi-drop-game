<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#d9412b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<title>著毋著快問快答・台語闖關</title>
<style>
#stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;max-width:820px;width:100%;margin:0 auto;justify-content:center}
.tbar{height:14px;background:#fff;border:3px solid var(--line);border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:repeating-linear-gradient(-45deg,var(--teal) 0 10px,#27a397 10px 20px)}
.q{position:relative;background:#fff;border:4px solid var(--line);border-radius:26px;box-shadow:0 8px 0 var(--line);padding:18px 12px 20px;text-align:center;min-height:34vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:background .15s}
.q.ok{background:#e2f7ea}.q.bad{background:#ffe6e3}
.q .hj{font-family:"Noto Serif TC",serif;font-weight:900;color:var(--red);line-height:1.1}
.q .tl{font-size:clamp(14px,2.2vw,20px);color:#7a5f48}
.q .eq{font-size:clamp(26px,5vw,44px);font-weight:900;color:#b49a82;line-height:1}
.q .zh{font-weight:900;color:var(--teal);line-height:1.1}
.q .mark{position:absolute;right:14px;top:10px;font-size:clamp(40px,8vw,70px);opacity:0;transition:opacity .1s}
.q.ok .mark,.q.bad .mark{opacity:1}
.combo{text-align:center;font-weight:900;font-size:20px;min-height:30px;color:var(--red)}
.combo b{background:linear-gradient(90deg,#f6c343,#ff7a3d);color:#fff;border:3px solid var(--line);border-radius:99px;padding:1px 14px}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans button{font-family:inherit;font-weight:900;font-size:clamp(28px,6vw,48px);border:4px solid var(--line);border-radius:22px;padding:16px 6px;cursor:pointer;box-shadow:0 7px 0 var(--line);color:#fff;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.ans button small{font-size:clamp(14px,2.2vw,18px);opacity:.9}
.ans button:active{transform:translateY(5px);box-shadow:0 2px 0 var(--line)}
.b-o{background:var(--ok)}.b-x{background:var(--bad)}
.keys{text-align:center;font-size:12px;color:#7a5f48;font-weight:700}
.review{display:grid;grid-template-columns:1.2fr 1fr;gap:4px 12px;text-align:left;background:#fff;border:2px solid #e3cfb0;border-radius:14px;padding:10px 12px;max-height:160px;overflow:auto;font-size:15px;margin-top:10px}
.review .x{color:var(--red);font-weight:900}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title">⭕ 著毋著</div>
    <div class="stat"><b id="timeV">30</b><span>秒</span></div>
    <div class="stat"><b id="okV">0</b><span>答對</span></div>
    <div class="stat"><b id="scoreV">0</b><span>分數</span></div>
    <button class="iconbtn" id="musicBtn">🎵</button>
    <button class="iconbtn" id="stopBtn">⏹</button>
    <a class="iconbtn" href="/" title="遊戲選單">🏠</a>
  </div>
  <div id="stage">
    <div class="tbar"><i id="tI"></i></div>
    <div class="q" id="q"><div class="hj" id="qHj">　</div><div class="tl tl" id="qTl"></div><div class="eq">＝</div><div class="zh" id="qZh">？</div><div class="mark" id="mark"></div></div>
    <div class="combo" id="combo"></div>
    <div class="ans"><button class="b-x" id="bX">❌<small>毋著</small></button><button class="b-o" id="bO">⭕<small>著</small></button></div>
    <div class="keys">鍵盤：← 毋著　→ 著</div>
  </div>
</div>
<div class="overlay" id="startOv"><div class="panel">
  <h1>⭕ 著毋著</h1>
  <p class="sub">畫面出現「台語 ＝ 華語？」，對就按 ⭕，錯就按 ❌！<br>連續答對分數會加倍，答錯扣 2 秒。<br><b id="timeN"></b> 秒內答對 <b id="passN"></b> 題就過關。</p>
  <h2>難度</h2><div class="seg" id="lvSeg"><button data-l="easy">入門</button><button data-l="mid" class="sel">進階</button><button data-l="hard">達人</button></div>
  <div class="row"><button class="btn red big" id="startBtn" style="flex:1">開始 ▶</button></div>
  <p class="muted" id="srcInfo" style="text-align:center"></p>
</div></div>
<div class="overlay hide" id="endOv"><div class="panel" style="text-align:center">
  <h1 id="endTitle"></h1><div class="big-num" id="endScore">0</div><p class="sub" id="endInfo"></p>
  <div id="passBox"></div><div id="reviewBox"></div>
  <div class="row" style="justify-content:center"><button class="btn red" id="againBtn">再玩一次</button><a class="btn" href="/">遊戲選單</a></div>
</div></div>
<script>
const {$,shuffle,esc}=T;
const TIME=30,PASS=12,PEN=2;$('passN').textContent=PASS;$('timeN').textContent=TIME;
let WORDS=[],pool=[],bag=[],lv=T.store.get('quiz_lv','mid'),cur=null,shown='',truth=false,ok=0,tried=0,combo=0,maxCombo=0,score=0,t0=0,penalty=0,raf=0,playing=false,wait=false,stopCd=null,wrong=[];
T.bindMusicBtn($('musicBtn'));T.onFirstTouch=()=>{if(!playing)T.music.play('title')};
document.querySelectorAll('#lvSeg button').forEach(b=>{b.classList.toggle('sel',b.dataset.l===lv);b.onclick=()=>{lv=b.dataset.l;T.store.set('quiz_lv',lv);document.querySelectorAll('#lvSeg button').forEach(x=>x.classList.toggle('sel',x===b))}});
T.loadWords().then(w=>{WORDS=w;$('srcInfo').textContent=`題庫：${T.wordSource}・${w.length} 詞`});
const mult=()=>combo>=10?3:combo>=5?2:1;
function next(){if(!bag.length)bag=shuffle(pool.slice());cur=bag.pop();truth=Math.random()<.5;
  if(truth)shown=cur.zh;else{const o=shuffle(pool.filter(w=>w.zh!==cur.zh&&w.lv===cur.lv));shown=(o[0]||shuffle(pool.filter(w=>w.zh!==cur.zh))[0]).zh}
  $('qHj').textContent=cur.hj;T.fitSize($('qHj'),cur.hj,80);$('qTl').textContent=cur.tl;$('qZh').textContent=shown+'？';T.fitSize($('qZh'),shown,64);
  $('q').className='q';wait=false}
function answer(say){if(!playing||wait)return;wait=true;tried++;const right=(say===truth);
  if(right){ok++;combo++;maxCombo=Math.max(maxCombo,combo);score+=10*mult();T.sfx.ok(combo);$('q').className='q ok';$('mark').textContent='⭕'}
  else{combo=0;penalty+=PEN;T.sfx.bad();$('q').className='q bad';$('mark').textContent='❌';wrong.push(cur);T.toast(cur.hj+' ＝ '+cur.zh,'bad',900)}
  $('okV').textContent=ok;$('scoreV').textContent=score;
  $('combo').innerHTML=combo>=2?`<b>🔥 連續 ${combo}${mult()>1?'　×'+mult():''}</b>`:'';
  setTimeout(()=>{if(playing)next()},right?260:800)}
$('bO').onclick=()=>answer(true);$('bX').onclick=()=>answer(false);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='o'||e.key==='O')answer(true);else if(e.key==='ArrowLeft'||e.key==='x'||e.key==='X')answer(false)});
function tick(){const left=Math.max(0,TIME-((performance.now()-t0)/1000+penalty));$('timeV').textContent=Math.ceil(left);$('tI').style.width=left/TIME*100+'%';
  $('tI').style.background=left<=8?'var(--bad)':'';T.music.rate=left<=10?1+(10-left)/10*.5:1;if(left<=0){end();return}raf=requestAnimationFrame(tick)}
function start(){T.fullscreen();$('startOv').classList.add('hide');$('endOv').classList.add('hide');
  pool=T.byLevel(WORDS,T.LEVELS[lv].lv);bag=[];ok=0;tried=0;combo=0;maxCombo=0;score=0;penalty=0;wrong=[];
  $('okV').textContent=0;$('scoreV').textContent=0;$('combo').innerHTML='';$('timeV').textContent=TIME;$('tI').style.width='100%';
  $('qHj').textContent='準備';$('qZh').textContent='？';$('qTl').textContent='';$('q').className='q';T.music.play('drive');
  stopCd=T.countdown(()=>{stopCd=null;playing=true;next();t0=performance.now();raf=requestAnimationFrame(tick)})}
function end(){playing=false;cancelAnimationFrame(raf);T.music.stop();const win=ok>=PASS;
  $('endTitle').textContent=win?'反應有夠緊！':'擱拚一下！';$('endScore').textContent=score;
  $('endInfo').textContent=`答對 ${ok} / ${tried} 題　最長連續 ${maxCombo}`;
  if(win){T.sfx.win();T.confetti(innerWidth/2,innerHeight/3,40);T.showResult($('passBox'),true)}else{T.sfx.bad();T.showResult($('passBox'),false,`答對 ${PASS} 題才過關，再試一次！`)}
  const u=[...new Map(wrong.map(w=>[w.hj,w])).values()];
  $('reviewBox').innerHTML=u.length?`<div class="review">${u.map(w=>`<div><span class="x">${esc(w.hj)}</span> <span class="muted tl">${esc(w.tl)}</span></div><div>${esc(w.zh)}</div>`).join('')}</div>`:'';
  $('endOv').classList.remove('hide');setTimeout(()=>T.music.play('title'),1600)}
$('startBtn').onclick=start;$('againBtn').onclick=start;
$('stopBtn').onclick=()=>{if(stopCd){stopCd();stopCd=null;T.music.play('title');$('startOv').classList.remove('hide');return}if(playing)end()};
</script>
</body>
</html>
