<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#d9412b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<title>台語打地鼠・台語闖關</title>
<style>
html,body{overflow:hidden}
.wrap{height:100%;height:100dvh;min-height:0}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.target{background:#fff;border:4px solid var(--line);border-radius:20px;box-shadow:0 6px 0 var(--line);padding:6px 24px 8px;text-align:center;min-width:min(420px,90%)}
.target .lab{font-size:13px;font-weight:900;color:#fff;background:var(--red);border-radius:99px;padding:1px 12px;display:inline-block}
.target .hj{font-family:"Noto Serif TC",serif;font-weight:900;color:var(--red);font-size:clamp(34px,7vw,60px);line-height:1.15}
.target .tl{font-size:clamp(13px,2vw,18px);color:#7a5f48}
.target.pop{animation:pp .35s}
#fieldWrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#field{display:grid;grid-template-columns:repeat(3,1fr);gap:4%;padding:3%;background:linear-gradient(#9fd29a,#6fb56c);border:4px solid var(--line);border-radius:26px;box-shadow:0 8px 0 var(--line);position:relative}
.hole{position:relative;aspect-ratio:1;overflow:hidden;border-radius:0 0 40% 40%}
.hole::before{content:"";position:absolute;left:6%;right:6%;bottom:4%;height:30%;background:#3b2716;border-radius:50%;box-shadow:inset 0 6px 0 #1f140a}
.hole::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16%;background:#8a5a33;border-radius:50% 50% 0 0/100% 100% 0 0;z-index:3;border-top:3px solid var(--line)}
.mole{position:absolute;left:12%;right:12%;bottom:6%;height:86%;transform:translateY(105%);transition:transform .16s ease-out;z-index:2;cursor:pointer}
.mole.up{transform:translateY(0)}
.mole .sign{position:absolute;left:-12%;right:-12%;top:0;height:40%;background:#fffaf0;border:3px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;line-height:1.1;text-align:center;padding:2px;word-break:break-all;box-shadow:0 3px 0 var(--line)}
.mole .stick{position:absolute;left:47%;width:6%;top:38%;height:14%;background:#8a5a33;border-left:2px solid var(--line);border-right:2px solid var(--line)}
.mole .body{position:absolute;left:8%;right:8%;top:46%;bottom:-6%;background:#9b6a43;border:3px solid var(--line);border-radius:50% 50% 20% 20%}
.mole .body::before,.mole .body::after{content:"";position:absolute;top:24%;width:14%;height:16%;background:#1b120b;border-radius:50%}
.mole .body::before{left:26%}.mole .body::after{right:26%}
.mole .nose{position:absolute;left:41%;width:18%;top:66%;height:10%;background:#ff8aa1;border:2px solid var(--line);border-radius:50%}
.mole .cheek{position:absolute;top:70%;width:12%;height:7%;background:#ffb3a1;border-radius:50%;opacity:.8}
.mole.hit .body::before,.mole.hit .body::after{height:4%;top:30%;border-radius:2px}
.mole.hit .sign{background:var(--ok);color:#fff}
.mole.miss .sign{background:var(--bad);color:#fff}
.mole.hit{animation:bonk .3s}
@keyframes bonk{40%{transform:translateY(0) scaleY(.8)}}
.hammer{position:fixed;font-size:56px;pointer-events:none;z-index:50;transform-origin:80% 80%;animation:ham .25s ease-out forwards}
@keyframes ham{from{transform:translate(-30%,-80%) rotate(-50deg)}to{transform:translate(-30%,-80%) rotate(10deg);opacity:.2}}
.star{position:fixed;pointer-events:none;z-index:51;font-size:30px;animation:fup .7s ease-out forwards}
@keyframes fup{to{transform:translateY(-60px);opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title">🔨 台語打地鼠</div>
    <div class="stat"><b id="timeV">60</b><span>秒</span></div>
    <div class="stat"><b id="hitV">0</b><span>打中</span></div>
    <button class="iconbtn" id="musicBtn">🎵</button>
    <button class="iconbtn" id="stopBtn">⏹</button>
    <a class="iconbtn" href="/" title="遊戲選單">🏠</a>
  </div>
  <div id="stage">
    <div class="target" id="target"><span class="lab">打中這個詞的華語！</span><div class="hj" id="tHj">　</div><div class="tl tl" id="tTl"></div></div>
    <div id="fieldWrap"><div id="field"></div></div>
  </div>
</div>
<div class="overlay" id="startOv"><div class="panel">
  <h1>🔨 台語打地鼠</h1>
  <p class="sub">上面出現台語詞，地鼠會舉著華語牌子冒出來，<br>打中<b>舉對答案</b>的地鼠！打錯會扣 3 秒。<br>60 秒內打中 <b id="passN"></b> 隻就過關。</p>
  <h2>難度</h2><div class="seg" id="lvSeg"><button data-l="easy">入門</button><button data-l="mid" class="sel">進階</button><button data-l="hard">達人</button></div>
  <div class="row"><button class="btn red big" id="startBtn" style="flex:1">開始 ▶</button></div>
  <p class="muted" id="srcInfo" style="text-align:center"></p>
</div></div>
<div class="overlay hide" id="endOv"><div class="panel" style="text-align:center">
  <h1 id="endTitle"></h1><div class="big-num" id="endScore">0</div><p class="sub" id="endInfo"></p>
  <div id="passBox"></div>
  <div class="row" style="justify-content:center"><button class="btn red" id="againBtn">再玩一次</button><a class="btn" href="/">遊戲選單</a></div>
</div></div>
<script>
const {$,shuffle,esc}=T;
const TIME=60,PASS=8,PEN=3;$('passN').textContent=PASS;
const SPEED={easy:[1900,1250],mid:[1600,1000],hard:[1400,850]}; // 地鼠停留毫秒：開始 → 最後
let WORDS=[],pool=[],bag=[],lv=T.store.get('whack_lv','mid'),cur=null,hits=0,miss=0,t0=0,penalty=0,raf=0,playing=false,stopCd=null;
let holes=[],spawnT=0,sinceCorrect=0;
T.bindMusicBtn($('musicBtn'));T.onFirstTouch=()=>{if(!playing)T.music.play('title')};
document.querySelectorAll('#lvSeg button').forEach(b=>{b.classList.toggle('sel',b.dataset.l===lv);b.onclick=()=>{lv=b.dataset.l;T.store.set('whack_lv',lv);document.querySelectorAll('#lvSeg button').forEach(x=>x.classList.toggle('sel',x===b))}});
T.loadWords().then(w=>{WORDS=w;$('srcInfo').textContent=`題庫：${T.wordSource}・${w.length} 詞`});
// 建 9 個洞
$('field').innerHTML=Array.from({length:9},(_,i)=>`<div class="hole"><div class="mole" data-i="${i}"><div class="sign"></div><div class="stick"></div><div class="body"></div><div class="nose"></div><div class="cheek" style="left:18%"></div><div class="cheek" style="right:18%"></div></div></div>`).join('');
holes=[...document.querySelectorAll('.mole')].map(el=>({el,up:false,zh:'',timer:0}));
function layout(){const w=$('fieldWrap');const s=Math.max(160,Math.min(w.clientWidth-4,w.clientHeight-14,640));$('field').style.width=s+'px';$('field').style.height=s+'px';
  const cell=s/3.4;holes.forEach(h=>h.el.querySelector('.sign').style.fontSize=Math.max(12,cell*.2)+'px')}
addEventListener('resize',()=>requestAnimationFrame(layout));layout();
function fitSign(h){const n=[...h.zh].length;const s=$('field').clientWidth/3.4;h.el.querySelector('.sign').style.fontSize=Math.max(11,s*(n<=2?.24:n<=3?.2:n<=4?.16:.13))+'px'}
function newTarget(){if(!bag.length)bag=shuffle(pool.slice());cur=bag.pop();$('tHj').textContent=cur.hj;$('tTl').textContent=cur.tl;
  const t=$('target');t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop');sinceCorrect=2;
  holes.forEach(h=>{if(h.up&&h.zh===cur.zh)down(h)})}
function stay(){const [a,b]=SPEED[lv];const p=Math.min(1,elapsed()/TIME);return a+(b-a)*p}
function elapsed(){return (performance.now()-t0)/1000+penalty}
function popUp(){const free=holes.filter(h=>!h.up);if(!free.length)return;const h=free[Math.random()*free.length|0];
  const correctUp=holes.some(x=>x.up&&x.zh===cur.zh);
  let zh;if(!correctUp&&(sinceCorrect>=2||Math.random()<.45)){zh=cur.zh;sinceCorrect=0}
  else{const used=new Set(holes.filter(x=>x.up).map(x=>x.zh));used.add(cur.zh);const c=shuffle(pool.filter(w=>!used.has(w.zh)));zh=(c[0]||pool[0]).zh;sinceCorrect++}
  h.zh=zh;h.el.className='mole up';h.el.querySelector('.sign').textContent=zh;fitSign(h);h.up=true;
  clearTimeout(h.timer);h.timer=setTimeout(()=>down(h),stay())}
function down(h){clearTimeout(h.timer);h.up=false;h.el.classList.remove('up')}
function hammer(x,y){const e=document.createElement('div');e.className='hammer';e.textContent='🔨';e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),260)}
$('field').addEventListener('pointerdown',e=>{if(!playing)return;hammer(e.clientX,e.clientY);const m=e.target.closest('.mole');if(!m)return;const h=holes[+m.dataset.i];if(!h.up)return;
  clearTimeout(h.timer);h.up=false;
  if(h.zh===cur.zh){hits++;$('hitV').textContent=hits;h.el.classList.add('hit');T.sfx.ok(hits);T.confetti(e.clientX,e.clientY,14);
    const s=document.createElement('div');s.className='star';s.textContent='⭐';s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),700);
    T.toast(cur.hj+' ＝ '+cur.zh,'ok',700);setTimeout(()=>{h.el.classList.remove('up');newTarget()},260)}
  else{miss++;penalty+=PEN;h.el.classList.add('miss');T.sfx.bad();T.toast('打毋著！－'+PEN+' 秒','bad',700);$('stage').classList.add('shake');setTimeout(()=>$('stage').classList.remove('shake'),400);
    setTimeout(()=>h.el.classList.remove('up'),300)}
});
function tick(t){if(!playing)return;const left=Math.max(0,TIME-elapsed());$('timeV').textContent=Math.ceil(left);T.music.rate=left<=10?1+(10-left)/10*.5:1;
  if(left<=0){end();return}
  const gap=Math.max(380,stay()*.55);if(t-spawnT>gap){spawnT=t;popUp();if(holes.filter(h=>h.up).length<2)popUp()}
  raf=requestAnimationFrame(tick)}
function start(){T.fullscreen();$('startOv').classList.add('hide');$('endOv').classList.add('hide');layout();
  pool=T.byLevel(WORDS,T.LEVELS[lv].lv);bag=[];hits=0;miss=0;penalty=0;$('hitV').textContent=0;$('timeV').textContent=TIME;holes.forEach(down);
  $('tHj').textContent='準備';$('tTl').textContent='';T.music.play('fun');
  stopCd=T.countdown(()=>{stopCd=null;playing=true;newTarget();t0=performance.now();spawnT=0;raf=requestAnimationFrame(tick)})}
function end(){playing=false;cancelAnimationFrame(raf);holes.forEach(down);T.music.stop();const win=hits>=PASS;
  $('endTitle').textContent=win?'打地鼠高手！':'擱來一擺！';$('endScore').textContent=hits;$('endInfo').textContent=`打中 ${hits} 隻，打錯 ${miss} 隻`;
  if(win){T.sfx.win();T.confetti(innerWidth/2,innerHeight/3,40);T.showResult($('passBox'),true)}else{T.sfx.bad();T.showResult($('passBox'),false,`打中 ${PASS} 隻才過關，再試一次！`)}
  $('endOv').classList.remove('hide');setTimeout(()=>T.music.play('title'),1600)}
$('startBtn').onclick=start;$('againBtn').onclick=start;
$('stopBtn').onclick=()=>{if(stopCd){stopCd();stopCd=null;T.music.play('title');$('startOv').classList.remove('hide');return}if(playing)end()};
</script>
</body>
</html>
