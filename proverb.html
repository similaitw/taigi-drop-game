<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#d9412b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<title>俗語接龍・台語闖關</title>
<style>
#stage{flex:1;display:flex;flex-direction:column;gap:14px;max-width:760px;width:100%;margin:0 auto;justify-content:center}
.scroll{position:relative;background:linear-gradient(#fffaf0,#fbecd0);border:4px solid var(--line);border-radius:20px;padding:26px 16px 22px;text-align:center;box-shadow:0 8px 0 var(--line)}
.scroll::before,.scroll::after{content:"";position:absolute;left:-10px;right:-10px;height:14px;background:var(--red);border:3px solid var(--line);border-radius:10px}
.scroll::before{top:-10px}.scroll::after{bottom:-10px}
.qn{font-size:14px;color:#8a6f58;font-weight:900}
.front{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(34px,7vw,64px);color:var(--red);line-height:1.2;margin:6px 0}
.front .blank{display:inline-block;min-width:3em;border-bottom:5px dashed var(--teal);color:var(--teal)}
.mean{min-height:28px;font-weight:900;color:var(--teal);font-size:clamp(16px,2.4vw,22px)}
.opts{display:grid;gap:10px}
.opt{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(22px,4.2vw,36px);background:#fff;border:3px solid var(--line);border-radius:18px;padding:14px 10px;cursor:pointer;box-shadow:0 5px 0 var(--line);color:var(--ink)}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.opt.ok{background:var(--ok);color:#fff}.opt.bad{background:var(--bad);color:#fff}.opt.ans{background:var(--gold)}
.tbar{height:12px;background:#fff;border:3px solid var(--line);border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--teal)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title">📜 俗語接龍</div>
    <div class="stat"><b id="qV">1/10</b><span>題目</span></div>
    <div class="stat"><b id="okV">0</b><span>答對</span></div>
    <div class="stat"><b id="scoreV">0</b><span>分數</span></div>
    <button class="iconbtn" id="musicBtn">🎵</button>
    <a class="iconbtn" href="/" title="遊戲選單">🏠</a>
  </div>
  <div id="stage">
    <div class="tbar"><i id="tI"></i></div>
    <div class="scroll"><div class="qn" id="qn"></div><div class="front" id="front"></div><div class="mean" id="mean"></div></div>
    <div class="opts" id="opts"></div>
  </div>
</div>
<div class="overlay" id="startOv"><div class="panel">
  <h1>俗語接龍</h1>
  <p class="sub">看俗語的上半句，選出正確的下半句！<br>共 10 題，答對 <b>7 題</b>就過關。越快答分數越高。</p>
  <div class="row"><button class="btn red big" id="startBtn" style="flex:1">開始 ▶</button></div>
</div></div>
<div class="overlay hide" id="endOv"><div class="panel" style="text-align:center">
  <h1 id="endTitle"></h1><div class="big-num" id="endScore">0</div><p class="sub" id="endInfo"></p>
  <div id="passBox"></div>
  <div class="row" style="justify-content:center"><button class="btn red" id="againBtn">再玩一次</button><a class="btn" href="/">遊戲選單</a></div>
</div></div>
<script>
const {$,shuffle,esc}=T;
const N=10,SEC=15,PASS=7;
let P=[],qs=[],qi=0,ok=0,score=0,t0=0,raf=0,locked=false,playing=false;
T.bindMusicBtn($('musicBtn'));T.onFirstTouch=()=>{if(!playing)T.music.play('title')};
fetch('/proverbs.json').then(r=>r.json()).then(j=>P=j.proverbs);
function start(){T.fullscreen();$('startOv').classList.add('hide');$('endOv').classList.add('hide');
  qs=shuffle(P.slice()).slice(0,N);qi=0;ok=0;score=0;$('okV').textContent=0;$('scoreV').textContent=0;
  T.music.play('fun');$('front').innerHTML='準備';$('opts').innerHTML='';$('mean').textContent='';
  T.countdown(()=>{playing=true;show()})}
function show(){const q=qs[qi];locked=false;$('qV').textContent=(qi+1)+'/'+N;$('qn').textContent='第 '+(qi+1)+' 題';
  $('front').innerHTML=esc(q.a)+'，<span class="blank">？</span>';$('mean').textContent='';
  const others=shuffle(P.filter(p=>p!==q)).slice(0,2);const opts=shuffle([q,...others]);
  $('opts').innerHTML=opts.map(o=>`<button class="opt" data-b="${esc(o.b)}">${esc(o.b)}</button>`).join('');
  t0=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
function tick(){const p=1-(performance.now()-t0)/1000/SEC;$('tI').style.width=Math.max(0,p*100)+'%';$('tI').style.background=p<.3?'var(--bad)':'';
  if(p<=0){answer(null);return}raf=requestAnimationFrame(tick)}
$('opts').addEventListener('click',e=>{const b=e.target.closest('.opt');if(b)answer(b)});
function answer(btn){if(locked)return;locked=true;cancelAnimationFrame(raf);const q=qs[qi];
  const right=btn&&btn.dataset.b===q.b;
  document.querySelectorAll('.opt').forEach(o=>{if(o.dataset.b===q.b)o.classList.add(right?'ok':'ans')});
  if(right){ok++;const left=Math.max(0,SEC-(performance.now()-t0)/1000);const g=10+Math.round(left);score+=g;T.sfx.ok(ok);
    const r=btn.getBoundingClientRect();T.confetti(r.left+r.width/2,r.top,16);T.toast('+'+g,'ok')}
  else{if(btn)btn.classList.add('bad');T.sfx.bad();T.toast(btn?'毋著！':'時間到！','bad')}
  $('front').innerHTML=esc(q.a)+'，<span style="color:var(--teal)">'+esc(q.b)+'</span>';$('mean').textContent='意思：'+q.m;
  $('okV').textContent=ok;$('scoreV').textContent=score;
  setTimeout(()=>{qi++;if(qi<N)show();else end()},2000)}
function end(){playing=false;T.music.stop();const win=ok>=PASS;
  $('endTitle').textContent=win?'俗語達人！':'差一點點！';$('endScore').textContent=score;$('endInfo').textContent=`答對 ${ok} / ${N} 題`;
  if(win){T.sfx.win();T.confetti(innerWidth/2,innerHeight/3,40);T.showResult($('passBox'),true)}else{T.sfx.bad();$('passBox').innerHTML=`<div class="fail">要答對 ${PASS} 題才過關，再試一次！</div>`}
  $('endOv').classList.remove('hide');setTimeout(()=>T.music.play('title'),1600)}
$('startBtn').onclick=start;$('againBtn').onclick=start;
</script>
</body>
</html>
