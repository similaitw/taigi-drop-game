<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#d9412b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<script src="lib/qrcode.js"></script>
<script src="common.js"></script>
<title>台語闖關大挑戰</title>
<style>
.hero{text-align:center;margin:6px 0 4px}
.hero .lans{font-size:42px;letter-spacing:10px}
.prog{display:flex;align-items:center;gap:10px;margin:12px 0}
.bar{flex:1;height:18px;background:#fff;border:3px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--red) 0 10px,#e85a40 10px 20px);transition:width .5s}
.prog b{font-size:20px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.st{position:relative;background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 8px 10px;text-align:center;box-shadow:0 5px 0 var(--line);text-decoration:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:130px;justify-content:center;overflow:hidden}
.st:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.st .ic{font-size:40px;line-height:1.1}
.st .nm{font-weight:900;font-size:18px}
.st .ds{font-size:12px;color:#8a6f58;font-weight:700}
.st .go{margin-top:4px;font-size:12px;font-weight:900;color:var(--teal)}
.seal{position:absolute;inset:auto 6px 6px auto;width:70px;height:70px;border:4px solid var(--red);border-radius:50%;color:var(--red);font-family:"Noto Serif TC",serif;font-weight:900;font-size:22px;
  display:none;align-items:center;justify-content:center;transform:rotate(-18deg);background:rgba(255,255,255,.75);line-height:1}
.st.done .seal{display:flex}
.st.done{background:#fff8ea}
.st.fresh .seal{animation:stamp .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:rotate(-18deg) scale(3);opacity:0}to{transform:rotate(-18deg) scale(1);opacity:1}}
.reward{margin-top:16px;text-align:center}
.gift{font-size:80px;animation:pp 1.2s infinite}
.redeemed{font-size:28px;font-weight:900;color:var(--ok)}
.hold{position:relative;overflow:hidden}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.35)}
@media (max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.st{min-height:118px}.st .ic{font-size:34px}}
</style>
</head>
<body>
<div class="wrap" style="max-width:760px">
  <div class="topbar"><div class="title">🏮 台語闖關大挑戰</div><button class="iconbtn" id="musicBtn">🎵</button></div>
  <div class="panel">
    <div class="hero"><div class="lans">🏮🐦🏮</div><h1>闖關集章卡</h1>
      <p class="sub">每關過關後，用手機掃描過關 QR code 就能蓋章！<br>集滿 <b id="need"></b> 章可以換小禮物 🎁</p></div>
    <div class="prog"><div class="bar"><i id="barI"></i></div><b id="progT"></b></div>
    <div class="grid" id="grid"></div>
    <div class="reward" id="reward"></div>
    <div class="row" style="justify-content:space-between;margin-top:18px">
      <span class="muted" id="srcInfo"></span>
      <a href="#" class="muted" id="resetLink">重新開始集章</a>
    </div>
  </div>
</div>

<div class="overlay hide" id="giftOv">
  <div class="panel" style="text-align:center">
    <div class="gift">🎁</div>
    <h1>恭喜過關！</h1>
    <p class="sub">請把這個畫面給工作人員看</p>
    <div id="giftBody"></div>
    <div class="row" style="justify-content:center"><button class="btn" id="giftClose">關閉</button></div>
  </div>
</div>

<script>
const {$,store,esc}=T;
$('need').textContent=T.REWARD_AT;
T.bindMusicBtn($('musicBtn'));
T.onFirstTouch=()=>T.music.play('title');
const fresh=new URLSearchParams(location.search).get('new');
function render(){
  const s=T.stamps(),n=T.STATIONS.filter(x=>s[x.id]).length;
  $('grid').innerHTML=T.STATIONS.map(x=>`<a class="st${s[x.id]?' done':''}${fresh===x.id?' fresh':''}" href="${x.url}">
    <div class="ic">${x.icon}</div><div class="nm">${x.name}</div><div class="ds">${x.desc}</div>
    <div class="go">${s[x.id]?'再玩一次 ▶':'去挑戰 ▶'}</div><div class="seal">過關</div></a>`).join('');
  $('barI').style.width=Math.min(100,n/T.STATIONS.length*100)+'%';
  $('progT').textContent=`${n} / ${T.STATIONS.length}`;
  const red=store.get('tg_redeemed',0);
  if(red) $('reward').innerHTML=`<div class="redeemed">✔ 已兌換禮物</div><div class="muted">${new Date(red).toLocaleString('zh-TW',{hour12:false})}</div>`;
  else if(n>=T.REWARD_AT) $('reward').innerHTML=`<button class="btn red big" id="giftBtn">🎁 集滿了！兌換禮物</button>`;
  else $('reward').innerHTML=`<div class="muted" style="font-size:15px">再集 <b>${T.REWARD_AT-n}</b> 章就能換禮物，加油！</div>`;
  const gb=$('giftBtn'); if(gb) gb.onclick=openGift;
}
function openGift(){
  T.sfx.win();T.confetti(innerWidth/2,innerHeight/3,40);
  $('giftBody').innerHTML=`<p style="font-size:20px;font-weight:900">已集 ${T.STATIONS.filter(x=>T.stamps()[x.id]).length} 章</p>
    <button class="btn teal hold" id="holdBtn" style="width:100%">工作人員：長按 2 秒確認兌換<i></i></button>`;
  $('giftOv').classList.remove('hide');
  const b=$('holdBtn'),bar=b.querySelector('i');let t0=0,raf=0;
  const step=()=>{const p=Math.min(1,(performance.now()-t0)/2000);bar.style.width=p*100+'%';if(p>=1){done();return}raf=requestAnimationFrame(step)};
  const stop=()=>{cancelAnimationFrame(raf);bar.style.width='0'};
  b.onpointerdown=e=>{e.preventDefault();t0=performance.now();raf=requestAnimationFrame(step)};
  b.onpointerup=b.onpointerleave=b.onpointercancel=stop;
  function done(){store.set('tg_redeemed',Date.now());T.sfx.ding();$('giftOv').classList.add('hide');render()}
}
$('giftClose').onclick=()=>$('giftOv').classList.add('hide');
$('resetLink').onclick=e=>{e.preventDefault();if(window.confirm('要清除這支手機上的所有集章，重新開始嗎？')){store.set('tg_stamps',{});store.set('tg_redeemed',0);render()}};
render();
if(fresh){T.sfx.ding&&setTimeout(()=>{T.confetti(innerWidth/2,innerHeight/2,30)},300);history.replaceState(null,'','/booth')}
</script>
</body>
</html>
