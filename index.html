<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#d9412b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<title>台語闖關大挑戰</title>
<style>
.hero{text-align:center;padding:6px 0 2px}
.hero .bird{font-size:clamp(44px,8vw,64px);line-height:1;animation:hop 2.4s ease-in-out infinite}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-14px) rotate(-6deg)}90%{transform:translateY(0)}}
.hero h1{font-family:"Noto Serif TC",serif;margin:4px 0 0;color:var(--red);font-size:clamp(34px,7vw,58px);text-shadow:3px 3px 0 #fff,6px 6px 0 rgba(158,42,25,.22)}
.hero p{margin:6px 0 0;color:#6b513d;font-weight:700}
.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 16px}
.stampbtn b{color:var(--gold);margin-left:4px}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g{position:relative;display:flex;flex-direction:column;gap:6px;background:#fff;border:4px solid var(--line);border-radius:22px;box-shadow:0 7px 0 var(--line);
  padding:14px 14px 12px;text-decoration:none;color:var(--ink);overflow:hidden;transition:transform .1s}
.g:active{transform:translateY(4px);box-shadow:0 3px 0 var(--line)}
.g::before{content:"";position:absolute;left:0;right:0;top:0;height:64px;background:var(--c);opacity:.18}
.g .top{position:relative;display:flex;align-items:center;gap:10px}
.g .ic{font-size:40px;width:58px;height:58px;border-radius:16px;background:var(--c);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 3px 0 var(--line)}
.g .nm{font-weight:900;font-size:21px;line-height:1.2}
.g .nm small{display:block;font-size:12px;color:#8a6f58;font-weight:700}
.g .how{font-size:14px;line-height:1.55;color:#4a382b;flex:1}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tags span{font-size:12px;font-weight:900;background:var(--cream);border:2px solid #e3cfb0;border-radius:99px;padding:1px 8px}
.g .play{align-self:stretch;text-align:center;font-weight:900;font-size:17px;color:#fff;background:var(--c);border:3px solid var(--line);border-radius:14px;padding:7px;box-shadow:0 3px 0 var(--line)}
.seal{position:absolute;right:10px;top:10px;width:54px;height:54px;border:3px solid var(--red);border-radius:50%;color:var(--red);font-family:"Noto Serif TC",serif;font-weight:900;font-size:17px;
  display:none;align-items:center;justify-content:center;transform:rotate(-16deg);background:rgba(255,255,255,.85)}
.g.done .seal{display:flex}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:16px}
.guide{margin-top:16px}
.guide ol{margin:6px 0 0;padding-left:22px;line-height:1.8;font-weight:700}
@media (max-width:900px){.games{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.games{grid-template-columns:1fr;gap:12px}.g .how{font-size:13.5px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar" style="justify-content:flex-end"><button class="iconbtn" id="musicBtn">🎵</button></div>
  <div class="hero">
    <div class="bird">🐦</div>
    <h1>台語闖關大挑戰</h1>
    <p>揀一關來耍！找關主挑戰，過關畫面給關主看 🎉</p>
  </div>
<div style="height:14px"></div>
  <div class="games" id="games"></div>

  <div class="panel guide">
    <b style="font-size:18px">🙋 怎麼玩？</b>
    <ol>
      <li>到攤位找關主，選一關來挑戰。</li>
      <li>關主說明玩法、幫你選難度後按「開始」。</li>
      <li>過關會出現大大的「🎉 過關！」，把畫面給關主看就完成這一關。</li>
    </ol>
  </div>
  <div class="foot"><span class="muted" id="srcInfo"></span><a class="muted" href="/admin">題庫管理</a></div>
</div>
<script>
const {$,esc}=T;
const INFO={
  drop:   {c:'#d9412b',how:'台語詞從天上掉下來，移到正確的華語方塊接住。接對 8 題、正確率 6 成以上就過關。',tags:['👤 1 人','⏱ 60 秒','📱 手機／平板']},
  duel:   {c:'#2b74c9',how:'兩人對戰！看到台語，誰先按對華語誰得分，按錯凍結 1.5 秒。平板平放可以面對面玩。',tags:['👥 2 人','⚔️ 先拿 7 分','📲 平板']},
  memory: {c:'#8e5bd1',how:'翻開兩張牌，台語和華語意思一樣就配成一對。限時內把 8 對全部配完就過關。',tags:['👤 1 人','⏱ 90～120 秒','📱 手機／平板']},
  proverb:{c:'#c78f12',how:'看俗語的上半句，從三個選項選出下半句，還會告訴你意思。10 題答對 7 題過關。',tags:['👤 1 人','📜 10 題','👴 長輩最愛']},
  whack:  {c:'#8a5a33',how:'上面出現台語詞，地鼠舉著華語牌子冒出來，打中舉對答案的地鼠！打錯扣 3 秒，60 秒打中 8 隻過關。',tags:['👤 1 人','⏱ 60 秒','🔨 手眼反應']},
  quiz:   {c:'#25a566',how:'畫面出現「台語 ＝ 華語？」，對就按 ⭕、錯就按 ❌。連續答對分數加倍，30 秒內答對 12 題過關。',tags:['👤 1 人','⏱ 30 秒','⚡ 快問快答']}
};
T.bindMusicBtn($('musicBtn'));T.onFirstTouch=()=>T.music.play('title');
function render(){
  $('games').innerHTML=T.STATIONS.map(x=>{const i=INFO[x.id];return `<a class="g" href="${x.url}" style="--c:${i.c}">
    <div class="top"><div class="ic">${x.icon}</div><div class="nm">${esc(x.name)}<small>${esc(x.desc)}</small></div></div>
    <div class="how">${esc(i.how)}</div><div class="tags">${i.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>
    <div class="play">開始挑戰 ▶</div></a>`}).join('')}
render();addEventListener('pageshow',render);
T.loadWords().then(w=>$('srcInfo').textContent=`題庫：${T.wordSource}・${w.length} 詞`);
</script>
</body>
</html>
