<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#d9412b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<script src="lib/qrcode.js"></script>
<script src="common.js"></script>
<title>講台語挑戰・台語闖關</title>
<style>
#stage{flex:1;display:flex;flex-direction:column;gap:12px;max-width:820px;width:100%;margin:0 auto;justify-content:center}
.tbar{height:14px;background:#fff;border:3px solid var(--line);border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:repeating-linear-gradient(-45deg,var(--teal) 0 10px,#27a397 10px 20px)}
.prompt{position:relative;background:#fff;border:4px solid var(--line);border-radius:24px;box-shadow:0 8px 0 var(--line);text-align:center;padding:22px 12px;min-height:38vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.prompt .lab{font-size:15px;font-weight:900;color:#fff;background:var(--teal);border-radius:99px;padding:2px 14px}
.prompt .zh{font-weight:900;font-size:clamp(48px,11vw,110px);line-height:1.15;margin:10px 0}
.prompt .ans{min-height:64px;font-family:"Noto Serif TC",serif;font-weight:900;color:var(--red);font-size:clamp(30px,6vw,56px);opacity:0;transition:opacity .2s}
.prompt .ans.show{opacity:1}
.prompt .ans small{display:block;font-family:"Noto Sans","Noto Sans TC",sans-serif;font-size:clamp(15px,2.4vw,22px);color:#7a5f48;font-weight:700}
.judge{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.judge button{font-family:inherit;font-weight:900;font-size:clamp(20px,3.6vw,32px);border:3px solid var(--line);border-radius:18px;padding:16px 6px;cursor:pointer;box-shadow:0 6px 0 var(--line);color:#fff}
.judge button:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.j-ok{background:var(--ok)}.j-bad{background:var(--bad)}.j-skip{background:#9b8670}
.staff{text-align:center;font-size:13px;color:#7a5f48;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title">🎤 講台語挑戰</div>
    <div class="stat"><b id="timeV">60</b><span>秒</span></div>
    <div class="stat"><b id="okV">0</b><span>講對</span></div>
    <button class="iconbtn" id="musicBtn">🎵</button>
    <button class="iconbtn" id="stopBtn">⏹</button>
    <a class="iconbtn" href="/" title="遊戲選單">🏠</a>
  </div>
  <div id="stage">
    <div class="tbar"><i id="tI"></i></div>
    <div class="prompt"><span class="lab">用台語講出來</span><div class="zh" id="zh">　</div><div class="ans" id="ans"></div></div>
    <div class="judge"><button class="j-bad" id="jBad">✗ 毋著</button><button class="j-skip" id="jSkip">跳過</button><button class="j-ok" id="jOk">✓ 著</button></div>
    <div class="staff">工作人員判斷　鍵盤：→ 著　← 毋著　↓ 跳過</div>
  </div>
</div>
<div class="overlay" id="startOv"><div class="panel">
  <h1>講台語挑戰</h1>
  <p class="sub">畫面出現華語，請你用<b>台語</b>講出來！<br>工作人員聽了按「著」或「毋著」，60 秒內講對 <b id="passN">5</b> 個就過關。</p>
  <h2>難度</h2><div class="seg" id="lvSeg"><button data-l="easy" class="sel">入門</button><button data-l="mid">進階</button><button data-l="hard">達人</button></div>
  <div class="row"><button class="btn red big" id="startBtn" style="flex:1">開始 ▶</button></div>
  <p class="muted" id="srcInfo" style="text-align:center"></p>
</div></div>
<div class="overlay hide" id="endOv"><div class="panel" style="text-align:center">
  <h1 id="endTitle"></h1><div class="big-num" id="endScore">0</div><p class="sub" id="endInfo"></p>
  <div id="passBox"></div>
  <div class="row" style="justify-content:center"><button class="btn red" id="againBtn">再玩一次</button><a class="btn" href="/booth">集章卡</a><a class="btn" href="/">遊戲選單</a></div>
</div></div>
<script>
const {$,shuffle,esc}=T;
const TIME=60,PASS=5;$('passN').textContent=PASS;
let WORDS=[],pool=[],bag=[],lv=T.store.get('speak_lv','easy'),cur=null,ok=0,tried=0,t0=0,raf=0,playing=false,wait=false,stopCd=null;
T.bindMusicBtn($('musicBtn'));T.onFirstTouch=()=>{if(!playing)T.music.play('title')};
document.querySelectorAll('#lvSeg button').forEach(b=>{b.classList.toggle('sel',b.dataset.l===lv);b.onclick=()=>{lv=b.dataset.l;T.store.set('speak_lv',lv);document.querySelectorAll('#lvSeg button').forEach(x=>x.classList.toggle('sel',x===b))}});
T.loadWords().then(w=>{WORDS=w;$('srcInfo').textContent=`題庫：${T.wordSource}・${w.length} 詞`});
function next(){if(!bag.length)bag=shuffle(pool.slice());cur=bag.pop();$('zh').textContent=cur.zh;T.fitSize($('zh'),cur.zh,110);$('ans').className='ans';$('ans').innerHTML='';wait=false}
function judge(r){if(!playing||wait)return;wait=true;
  $('ans').innerHTML=esc(cur.hj)+(cur.tl?`<small>${esc(cur.tl)}</small>`:'');$('ans').className='ans show';
  if(r==='ok'){ok++;tried++;$('okV').textContent=ok;T.sfx.ok(ok);T.toast('講著矣！','ok');const z=$('zh').getBoundingClientRect();T.confetti(z.left+z.width/2,z.top+z.height/2,18)}
  else if(r==='bad'){tried++;T.sfx.bad();T.toast('正確是「'+cur.hj+'」','bad',1100)}
  else T.sfx.tick();
  setTimeout(()=>{if(playing)next()},r==='ok'?900:1400)}
$('jOk').onclick=()=>judge('ok');$('jBad').onclick=()=>judge('bad');$('jSkip').onclick=()=>judge('skip');
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='Enter')judge('ok');else if(e.key==='ArrowLeft')judge('bad');else if(e.key==='ArrowDown')judge('skip')});
function tick(){const left=Math.max(0,TIME-(performance.now()-t0)/1000);$('timeV').textContent=Math.ceil(left);$('tI').style.width=left/TIME*100+'%';
  T.music.rate=left<=10?1+(10-left)/10*.5:1;if(left<=0){end();return}raf=requestAnimationFrame(tick)}
function start(){T.fullscreen();$('startOv').classList.add('hide');$('endOv').classList.add('hide');
  pool=T.byLevel(WORDS,T.LEVELS[lv].lv);bag=[];ok=0;tried=0;$('okV').textContent=0;$('timeV').textContent=TIME;$('tI').style.width='100%';
  $('zh').textContent='準備';$('ans').className='ans';T.music.play('drive');
  stopCd=T.countdown(()=>{stopCd=null;playing=true;next();t0=performance.now();raf=requestAnimationFrame(tick)})}
function end(){playing=false;cancelAnimationFrame(raf);T.music.stop();const win=ok>=PASS;
  $('endTitle').textContent=win?'台語講真好！':'擱加油！';$('endScore').textContent=ok;$('endInfo').textContent=`講對 ${ok} 個（共 ${tried} 題）`;
  if(win){T.sfx.win();T.confetti(innerWidth/2,innerHeight/3,40);T.showPass($('passBox'),'speak')}else{T.sfx.bad();$('passBox').innerHTML=`<div class="fail">講對 ${PASS} 個才過關，再試一次！</div>`}
  $('endOv').classList.remove('hide');setTimeout(()=>T.music.play('title'),1600)}
$('startBtn').onclick=start;$('againBtn').onclick=start;
$('stopBtn').onclick=()=>{if(stopCd){stopCd();stopCd=null;T.music.play('title');$('startOv').classList.remove('hide');return}if(playing)end()};
</script>
</body>
</html>
